name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APKs (Standard & AI OCR)
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p dist_android
          cp android/app/build/outputs/apk/standard/debug/app-standard-debug.apk dist_android/AKN-FJNU-Grades-Tracker_Standard.apk
          cp android/app/build/outputs/apk/ocr/debug/app-ocr-debug.apk dist_android/AKN-FJNU-Grades-Tracker_AI_OCR.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AKN-FJNU-Grades-Tracker_Android
          path: dist_android/*.apk

